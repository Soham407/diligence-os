<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="160" viewBox="0 0 1200 160"
     role="img" aria-labelledby="tiers-title tiers-desc">
  <title id="tiers-title">Three-tier product model</title>
  <desc id="tiers-desc">Retail for individual investors, B2B SaaS for advisors, and Agency for research shops — sharing the same source layer and agent infrastructure.</desc>

  <defs>
    <linearGradient id="tier-bg" x1="0" y1="0" x2="1200" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060B14"/>
      <stop offset="100%" stop-color="#0C1425"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="160" rx="12" fill="url(#tier-bg)"/>

  <!-- Tier 1: Retail -->
  <g transform="translate(56, 24)">
    <rect x="0" y="0" width="340" height="112" rx="10" fill="#0F1729" stroke="#1E293B" stroke-width="1"/>
    <rect x="0" y="0" width="340" height="4" rx="2" fill="#3B82F6" opacity="0.6"/>
    <text x="20" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" font-weight="800" fill="#E2E8F0">Retail</text>
    <text x="72" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="11" fill="#64748B">freemium</text>
    <text x="20" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#94A3B8">Paste a ticker → AI-summarized earnings</text>
    <text x="20" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#94A3B8">with key takeaways and red flags.</text>

    <g transform="translate(20, 88)">
      <rect x="0" y="0" width="58" height="18" rx="4" fill="#1E293B"/>
      <text x="29" y="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="8" fill="#64748B" text-anchor="middle">Next.js</text>
      <rect x="64" y="0" width="42" height="18" rx="4" fill="#1E293B"/>
      <text x="85" y="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="8" fill="#64748B" text-anchor="middle">Expo</text>
    </g>
  </g>

  <!-- Tier 2: B2B SaaS -->
  <g transform="translate(424, 24)">
    <rect x="0" y="0" width="340" height="112" rx="10" fill="#0F1729" stroke="#1E293B" stroke-width="1"/>
    <rect x="0" y="0" width="340" height="4" rx="2" fill="#8B5CF6" opacity="0.6"/>
    <text x="20" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" font-weight="800" fill="#E2E8F0">B2B SaaS</text>
    <text x="92" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="11" fill="#64748B">paid</text>
    <text x="20" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#94A3B8">Full due-diligence dossier: financials,</text>
    <text x="20" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#94A3B8">governance, peer comparison in minutes.</text>

    <g transform="translate(20, 88)">
      <rect x="0" y="0" width="84" height="18" rx="4" fill="#1E293B"/>
      <text x="42" y="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="8" fill="#64748B" text-anchor="middle">Dashboard</text>
      <rect x="90" y="0" width="62" height="18" rx="4" fill="#1E293B"/>
      <text x="121" y="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="8" fill="#64748B" text-anchor="middle">Realtime</text>
    </g>
  </g>

  <!-- Tier 3: Agency -->
  <g transform="translate(792, 24)">
    <rect x="0" y="0" width="340" height="112" rx="10" fill="#0F1729" stroke="#1E293B" stroke-width="1"/>
    <rect x="0" y="0" width="340" height="4" rx="2" fill="#10B981" opacity="0.6"/>
    <text x="20" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" font-weight="800" fill="#E2E8F0">Agency</text>
    <text x="78" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="11" fill="#64748B">internal tool</text>
    <text x="20" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#94A3B8">White-label deep-dive reports for</text>
    <text x="20" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#94A3B8">research shops to sell under own brand.</text>

    <g transform="translate(20, 88)">
      <rect x="0" y="0" width="78" height="18" rx="4" fill="#1E293B"/>
      <text x="39" y="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="8" fill="#64748B" text-anchor="middle">Projects</text>
      <rect x="84" y="0" width="90" height="18" rx="4" fill="#1E293B"/>
      <text x="129" y="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="8" fill="#64748B" text-anchor="middle">White-label</text>
      <rect x="180" y="0" width="78" height="18" rx="4" fill="#1E293B"/>
      <text x="219" y="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="8" fill="#64748B" text-anchor="middle">PDF export</text>
    </g>
  </g>
</svg>
